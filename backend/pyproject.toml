[project]
name = "sentinel"
version = "0.1.0"
description = "An AI-powered multimodal intelligence platform for searching, analysing, and reasoning over documents and images."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "clerk-backend-api>=6.0.1",
    "cryptography>=45.0.0,<49.0.0",
    "fastapi>=0.139.0",
    "google-cloud-storage>=3.13.0",
    "google-genai>=1.51.0",
    "pydantic-settings>=2.14.2",
    "pymysql>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.50.0",
]
