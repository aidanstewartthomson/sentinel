[project]
name = "sentinel"
version = "0.1.0"
description = "An AI-powered multimodal intelligence platform for searching, analysing, and reasoning over documents and images."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.14.0",
    "fastapi>=0.139.0",
    "google-cloud-storage>=3.13.0",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "transformers>=5.13.0",
    "uvicorn>=0.50.0",
]
